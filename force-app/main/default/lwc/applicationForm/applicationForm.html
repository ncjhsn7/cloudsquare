<template>
    <lightning-card title="Application Form" icon-name="standard:lead">
        <div class="slds-p-horizontal_medium slds-p-bottom_medium slds-is-relative">
            <template lwc:if={isLoading}>
                <lightning-spinner alternative-text="Submitting application" size="medium"></lightning-spinner>
            </template>
            <lightning-input
                label="Company Name"
                name="companyName"
                value={formData.companyName}
                required
                onchange={handleChange}>
            </lightning-input>
            <lightning-input
                label="Federal Tax ID"
                name="federalTaxId"
                value={formData.federalTaxId}
                onchange={handleChange}>
            </lightning-input>
            <lightning-input
                label="Contact First Name"
                name="firstName"
                value={formData.firstName}
                required
                onchange={handleChange}>
            </lightning-input>
            <lightning-input
                label="Contact Last Name"
                name="lastName"
                value={formData.lastName}
                required
                onchange={handleChange}>
            </lightning-input>
            <lightning-input
                type="email"
                label="Email"
                name="email"
                value={formData.email}
                required
                onchange={handleChange}>
            </lightning-input>
            <lightning-input
                type="tel"
                label="Phone"
                name="phone"
                value={formData.phone}
                required
                onchange={handleChange}>
            </lightning-input>
            <lightning-input
                type="number"
                formatter="currency"
                step="0.01"
                label="Annual Revenue"
                name="annualRevenue"
                value={formData.annualRevenue}
                onchange={handleChange}>
            </lightning-input>
            <div class="slds-m-top_medium">
                <lightning-button
                    variant="brand"
                    label="Submit Application"
                    disabled={isLoading}
                    onclick={handleSubmit}>
                </lightning-button>
            </div>
            <template lwc:if={resultMessage}>
                <div class={messageClass} role="alert">{resultMessage}</div>
            </template>
        </div>
    </lightning-card>
</template>
